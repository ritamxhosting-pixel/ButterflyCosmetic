plugins {
    id 'java'
}

group = 'com.ritamx'
version = '1.1.0'

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    mavenCentral()
}

dependencies {
    // Matches the Paper build shown in your server log.
    compileOnly 'io.papermc.paper:paper-api:26.2.build.135-stable'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    archiveBaseName = 'ButterflyCosmetic'
}
